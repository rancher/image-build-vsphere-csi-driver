---
name: "Update vsphere-csi-driver version"

sources:
  upstream:
    name: Get vsphere-csi-driver version
    kind: githubrelease
    spec:
      owner: kubernetes-sigs
      repository: vsphere-csi-driver
      token: '{{ requiredEnv .github.token }}'
      typefilter:
        release: true
        draft: false
        prerelease: false
      versionfilter:
        kind: semver

targets:
  tagfile:
    name: "Bump to latest vsphere-csi-driver version in TAG file"
    kind: file
    scmid: default
    disablesourceinput: true
    spec:
      file: TAG
      matchpattern: '(?m)^v[0-9]+\.[0-9]+\.[0-9]+$'
      replacepattern: '{{ source "upstream" }}'

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ .github.username }}'
      user: '{{ .github.username }}'
      email: '{{ .github.email }}'
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'

actions:
  default:
    title: 'Bump vsphere-csi-driver version to {{ source "upstream" }}'
    kind: github/pullrequest
    spec:
      merge:
        strategy: auto
      labels:
        - updatecli
        - github_actions
    scmid: default
