# This workflow automatically creates a GitHub release when the TAG file is updated on main.
# 99% of the time, from an UpdateCLI PR that bumps the TAG while tracking upstream.
name: Release On Tag Update
on:
  push:
    branches:
      - main
    paths:
      - 'TAG'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Calculate release tag from TAG file
        run: |
          TAG=$(make -s log | grep '^TAG=' | cut -d '=' -f2)
          BUILD_META=$(make -s log | grep '^BUILD_META=' | cut -d '=' -f2)
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "BUILD_META=${BUILD_META}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${TAG}${BUILD_META}" >> "$GITHUB_ENV"

      - name: Validate TAG change and release uniqueness
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          SHOULD_RELEASE=true

          base_sha="${{ github.event.before }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi

          changed_files="$(git diff --name-only "$base_sha" "$GITHUB_SHA")"
          if [[ "$changed_files" != "TAG" ]]; then
            echo "Expected the commit to change only TAG, found:"
            echo "$changed_files"
            exit 1
          fi

          tag_diff="$(git diff --unified=0 "$base_sha" "$GITHUB_SHA" -- TAG)"
          changed_lines="$(grep -E '^[+-]' <<< "$tag_diff" | grep -Ev '^(\+\+\+|---)' || true)"
          changed_count="$(wc -l <<< "$changed_lines" | tr -d ' ')"

          if [[ "$changed_count" -ne 2 ]]; then
            echo "Expected only one TAG line replacement, found $changed_count changed lines"
            echo "$changed_lines"
            exit 1
          fi

          removed_line="$(grep -E '^-' <<< "$changed_lines" | head -n1 || true)"
          added_line="$(grep -E '^\+' <<< "$changed_lines" | head -n1 || true)"

          if ! [[ "$removed_line" =~ ^-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Removed TAG line is not the expected version format"
            echo "$removed_line"
            exit 1
          fi

          if ! [[ "$added_line" =~ ^\+v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Added TAG line is not the expected version format"
            echo "$added_line"
            exit 1
          fi

          previous_tag="${removed_line#-}"
          new_tag="${added_line#+}"
          if [[ "$previous_tag" == "$new_tag" ]]; then
            echo "TAG line was not actually changed"
            exit 1
          fi

          echo "Validation passed: TAG changed from $previous_tag to $new_tag."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping"
            SHOULD_RELEASE=false
          fi

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Read app secrets
        if: steps.validate.outputs.should_release == 'true'
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/github/rancher-release-team-auto-tagger/app-credentials appId | APP_ID ;
            secret/data/github/repo/${{ github.repository }}/github/rancher-release-team-auto-tagger/app-credentials privateKey | PRIVATE_KEY

      - name: Generate GitHub App token
        if: steps.validate.outputs.should_release == 'true'
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}

      - name: Create GitHub release if missing
        if: steps.validate.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target main \
            --title "$RELEASE_TAG" \
            --generate-notes